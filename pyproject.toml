[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-platform-vultr"
version = "0.1.3"  # the plugin's own release (CHANGELOG.md); the platform shows it on the plugin's page
description = "Vultr for Liminal's platform: your account through Vultr's API v2 (balance, instances and their prices, DNS, firewall groups, SSH keys, storage, reserved IPs), the changes that cost nothing, each confirmed, and Dynamic DNS through Vultr's DNS."
readme = "README.md"
requires-python = ">=3.10"
# the library it plugs into (the machine kind and plugin API 2.2: liminal_libs.machines, its REST client over the
# library's requests and its Dynamic DNS keeper changing only what is its own, a take-over asked twice and
# single-use, 1.49.8; the Login interface)
dependencies = ["liminal-libs>=1.49.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
vultr = "plugin_platform_vultr"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
